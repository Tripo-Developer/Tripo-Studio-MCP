name: Sync Skill Release to Registries

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. v0.1.0). Defaults to the current ref or manifest version."
        required: false
        type: string

concurrency:
  group: release-sync-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          persist-credentials: false

      - name: Validate package and Cursor Marketplace / manifest version parity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
        run: |
          python3 scripts/validate_package.py
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path

          manifests = {
              "plugin.json": json.loads(Path("plugin.json").read_text()).get("version"),
              ".cursor-plugin/plugin.json": json.loads(Path(".cursor-plugin/plugin.json").read_text()).get("version"),
              ".cursor-plugin/marketplace.json": json.loads(Path(".cursor-plugin/marketplace.json").read_text())["plugins"][0].get("version"),
              ".claude-plugin/plugin.json": json.loads(Path(".claude-plugin/plugin.json").read_text()).get("version"),
          }
          versions = set(manifests.values())
          if len(versions) != 1:
              sys.exit(f"Manifest version mismatch across Cursor/Claude/root manifests: {manifests}")

          manifest_version = next(iter(versions))
          tag = os.environ.get("RELEASE_TAG", "").strip()
          if tag:
              expected = tag[1:] if tag.startswith("v") else tag
              if expected != manifest_version:
                  sys.exit(
                      f"Git tag {tag!r} does not match manifest version {manifest_version!r}. "
                      "Bump version in plugin.json, .cursor-plugin/plugin.json, .cursor-plugin/marketplace.json, "
                      "and .claude-plugin/plugin.json before tagging so Cursor Marketplace and ClawHub stay in sync."
                  )
          print(f"Verified version {manifest_version} across all Cursor Marketplace and Agent Plugin manifests")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish Skill to ClawHub (@tripo-ai)
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::CLAWHUB_TOKEN secret is not configured in GitHub repository settings."
            exit 1
          fi
          VERSION=$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')
          COMMIT_SHA=$(git rev-parse HEAD)
          CHANGELOG="${RELEASE_NOTES:-Release v${VERSION} of Tripo Studio MCP Skill}"
          npx --yes clawhub login --token "$CLAWHUB_TOKEN"
          npx --yes clawhub whoami
          npx --yes clawhub skill publish ./skills/tripo-studio-mcp \
            --slug tripo-studio-mcp \
            --name "Tripo Studio MCP" \
            --owner tripo-ai \
            --version "$VERSION" \
            --source-repo "${{ github.repository }}" \
            --source-commit "$COMMIT_SHA" \
            --source-ref "v${VERSION}" \
            --source-path "skills/tripo-studio-mcp" \
            --changelog "$CHANGELOG" || {
              echo "Checking if version ${VERSION} is already published under @tripo-ai..."
              npx --yes clawhub inspect tripo-studio-mcp | grep -F "v${VERSION}"
            }

      - name: Trigger Skills.sh index refresh
        run: |
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          npx --yes skills add "${{ github.repository }}" --skill tripo-studio-mcp --yes --agent codex || true
